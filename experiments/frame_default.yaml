# Default Hyperparameters for Hiera MAE Frame-level Training

# Experiment Management
seed: 42

# Data
data_path: "data/comma2k19_frames"
train_split: null
val_split: 0.1
batch_size: 16
workers: 4
mask_ratio: 0.6
shuffle: true
persistent_workers: true
prefetch_factor: 2

# Model Architecture (Hiera-Tiny default adjusted for 52x72 token dimensions)
embed_dim: 96
num_heads: 1
stages: [1, 2, 7, 2]
q_pool: 2
q_stride: [2, 2]
mask_unit_size: [4, 4]
patch_stride: [16, 16]
mlp_ratio: 4.0

# Decoder Configuration
decoder_embed_dim: 256
decoder_depth: 4
decoder_num_heads: 8

# Optimizer & Training
lr: 0.00015
weight_decay: 0.05
warmup_epochs: 5
num_epochs: 40
grad_clip: 1.0
save_every: 1
freeze_mask: false
amp: false
amp_dtype: "float16"
compile: false
compile_mode: "default"
