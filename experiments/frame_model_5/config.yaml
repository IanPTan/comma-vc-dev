# Config for Hiera MAE Frame-level training - Overfitting Test with train_split (frame_model_5)
seed: 42

# Data
data_path: "data/comma2k19_frames"
train_split: 0.000526         # Train on exactly 64 random frames (~0.053% of total dataset)
val_split: 0.0               # Disables validation splits
batch_size: 32
workers: 4
mask_ratio: 0.6
shuffle: true                # Shuffle the loaded frames for the training batch
persistent_workers: true     # Keep dataloader workers alive between epochs

# Model Architecture (Hiera-Tiny default adjusted for 52x72 token dimensions)
embed_dim: 96
num_heads: 1
stages: [1, 2, 7, 2]
q_pool: 2
q_stride: [2, 2]
mask_unit_size: [4, 4]
patch_stride: [16, 16]
mlp_ratio: 4.0

# Decoder Configuration
decoder_embed_dim: 256
decoder_depth: 4
decoder_num_heads: 8

# Optimizer & Training
lr: 0.0008                   # Base learning rate. Scaled: 0.0004 * (64 / 256) = 0.0001
weight_decay: 0.0            # Disable weight decay to permit perfect overfitting
warmup_epochs: 0             # Start cosine decay schedule immediately
num_epochs: 10000             # Deep overfitting convergence epochs (stretched schedule)
grad_clip: 1.0
save_every: 1000             # Save checkpoints every 1000 epochs
freeze_mask: false           # Keep masking dynamic
amp: true
amp_dtype: "float16"
compile: false
compile_mode: "default"
